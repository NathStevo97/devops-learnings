name: devops-learnings markdownlint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  markdown-ci:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest

    steps:
    - name: Chekout the Repo
      uses: actions/checkout@v6

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Certifications
      with:
        config: .markdownlint.json
        globs: 'docs/certifications/*.md'

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Tooling
      with:
        config: .markdownlint.json
        globs: 'docs/tooling/*.md'

  deploy-mkdocs:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    needs: markdown-ci

    steps:

    - name: Chekout the Repo
      uses: actions/checkout@v6

    - name: Configure Git Credentials
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com

    - name: Install the latest version of uv and set the python version to 3.14
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        python-version: 3.14

    - run: uv sync

    - run: uv run mkdocs gh-deploy --force
