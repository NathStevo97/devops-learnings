name: devops-learnings markdownlint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  markdown-ci:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest

    steps:
    - name: Chekout the Repo
      uses: actions/checkout@v6

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Certifications
      with:
        config: .markdownlint.json
        globs: 'docs/certifications/*.md'

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Tooling
      with:
        config: .markdownlint.json
        globs: 'docs/tooling/*.md'

  deploy-zensical:
    defaults:
      run:
        shell: bash
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: markdown-ci
    runs-on: ubuntu-latest
    

    steps:

    - name: Configure Github Pages
      uses: actions/configure-pages@v5

    - name: Checkout the Repo
      uses: actions/checkout@v6

    - run: uv sync
    - run: uv run zensical build --clean

    - uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - uses: actions/deploy-pages@v5
      id: deployment
