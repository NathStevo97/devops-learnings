name: devops-learnings markdownlint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  markdown-ci:
    defaults:
      run:
        shell: bash
        
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    runs-on: ubuntu-latest

    steps:
    - name: Chekout the Repo
      uses: actions/checkout@v6

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Certifications
      with:
        config: .markdownlint.json
        globs: 'docs/certifications/*.md'

    - uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
      name: markdown-lint - Tooling
      with:
        config: .markdownlint.json
        globs: 'docs/tooling/*.md'

  deploy-zensical:
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: markdown-ci
    runs-on: ubuntu-latest
    

    steps:

    - name: Configure Github Pages
      uses: actions/configure-pages@v6

    - name: Checkout the Repo
      uses: actions/checkout@v6

    - name: Install the latest version of uv and set the python version to 3.14
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        python-version: 3.14

    - run: uv sync
    - run: uv run zensical build --clean

    - uses: actions/upload-pages-artifact@v4
      with:
        path: site

    - uses: actions/deploy-pages@v5
      id: deployment
